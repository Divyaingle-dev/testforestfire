<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Fire Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #eaf2e3;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 650px;
            margin-top: 40px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: darkgreen;
            margin-bottom: 25px;
        }

        .btn-primary {
            background: darkgreen;
            border: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>FWI Prediction</h1>

    <form action="{{ url_for('predict_datapoint') }}" method="post">

        <input type="number" name="Temperature"
        class="form-control mb-3"
        placeholder="Temperature" required>

        <input type="number" name="RH"
        class="form-control mb-3"
        placeholder="Relative Humidity (RH)" required>

        <input type="text" name="Ws"
        class="form-control mb-3"
        placeholder="Wind Speed (Ws)" required>

        <input type="number" name="Rain"
        class="form-control mb-3"
        placeholder="Rain" required>

        <input type="number" name="FFMC"
        class="form-control mb-3"
        placeholder="FFMC" required>

        <input type="number" name="DMC"
        class="form-control mb-3"
        placeholder="DMC" required>

        <input type="number" name="ISI"
        class="form-control mb-3"
        placeholder="ISI" required>

        <input type="number" name="Classes"
        class="form-control mb-3"
        placeholder="Classes (0 or 1)" required>

        <input type="number" name="Region"
        class="form-control mb-3"
        placeholder="Region (0 or 1)" required>

        <button type="submit"
        class="btn btn-primary btn-lg w-100">
            Predict
        </button>

    </form>

  
   {% if results is not none %}
    <div class="alert alert-success mt-4 text-center">
        <h4>FWI Prediction Result</h4>
        <h2>{{ results }}</h2>
    </div>
{% endif %}

{% if error %}
    <div class="alert alert-danger mt-3">
        {{ error }}
    </div>
{% endif %}

</div>

</body>
</html>
